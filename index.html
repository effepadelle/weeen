<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Weeën van Suzy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weeën">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0B0A0A">
<style>
/* Donker app-scherm: cijferbalk boven, tijdlijn met genummerde bolletjes, ronde knop onder */
:root {
  --bg: #0B0A0A;
  --bar: #262322;
  --chip: #4A4441;
  --fg: #F4F2F1;
  --muted: #8E8885;
  --dim: #5E5956;
  --go1: #7DEBC9; --go2: #3FC3A2;
  --stop1: #FF97B1; --stop2: #E2486F;
  --sheet: #1C1A19;
  --line: #34302E;
  --danger: #FF7A72;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  overscroll-behavior-y: none;
}
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
button { font-family: var(--font); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--go1); outline-offset: 2px; }

/* top bar */
.top {
  position: sticky; top: 0; z-index: 5; background: var(--bar);
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 26px;
  border-radius: 0 0 50% 50% / 0 0 30px 30px;
}
.nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; max-width: 520px; margin: 0 auto; }
.nav h1 { margin: 0; text-align: center; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.06em; }
.icon { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #1A1817; color: var(--fg); display: grid; place-items: center; cursor: pointer; padding: 0; }
.icon svg { width: 22px; height: 22px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 520px; margin: 18px auto 0; text-align: center; }
.stats .v { font-size: 2.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.stats .k { margin-top: 6px; font-size: 0.85rem; color: var(--muted); line-height: 1.2; }

/* timeline */
.timeline { max-width: 520px; margin: 0 auto; padding: 22px 0 300px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.heads { display: grid; grid-template-columns: 1fr 76px 1fr; color: var(--muted); font-size: 0.85rem; text-align: center; margin-bottom: 8px; }
.rows { position: relative; }
.row, .sep { display: grid; grid-template-columns: 1fr 76px 1fr; align-items: center; height: 70px; position: relative; }
.sep { height: 44px; }
.rows.has::before { content: ""; position: absolute; left: 50%; top: 35px; bottom: 35px; width: 22px; margin-left: -11px; background: var(--chip); z-index: 0; }
.dur { text-align: center; cursor: pointer; }
.dur .a { font-size: 1.55rem; font-variant-numeric: tabular-nums; }
.dur .b { font-size: 0.85rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.dot { position: relative; z-index: 1; justify-self: center; width: 58px; height: 58px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 1.35rem; color: var(--fg); border: 0; cursor: pointer; box-shadow: 0 0 22px rgba(255,255,255,0.10); font-variant-numeric: tabular-nums; }
.freq { text-align: center; color: var(--muted); font-size: 1.55rem; font-variant-numeric: tabular-nums; transform: translateY(50%); }
.sep span { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 0.85rem; position: relative; z-index: 1; background: var(--bg); justify-self: center; padding: 2px 8px; border-radius: 6px; }
.row.live .dot { background: var(--stop2); animation: pulse 1.6s ease-in-out infinite; }
.row.live .dur .a { color: var(--stop1); }
@keyframes pulse { 50% { box-shadow: 0 0 34px rgba(255,120,150,0.45); } }
.empty { text-align: center; color: var(--muted); padding: 40px 24px; line-height: 1.5; }

/* big button */
.fade { position: fixed; left: 0; right: 0; bottom: 0; height: 230px; background: linear-gradient(to bottom, rgba(11,10,10,0), var(--bg) 45%); pointer-events: none; z-index: 6; }
.go {
  position: fixed; z-index: 7; left: 50%; bottom: max(26px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  width: 216px; height: 216px; border-radius: 50%; border: 14px solid #2A2827; cursor: pointer;
  background: radial-gradient(circle at 50% 20%, var(--go1), var(--go2)); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6); text-shadow: 0 1px 2px rgba(0,0,0,0.12);
}
.go .l1 { font-size: 2.1rem; font-weight: 800; letter-spacing: 0.02em; line-height: 1; }
.go .l2 { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.02em; }
.go.live { background: radial-gradient(circle at 50% 20%, var(--stop1), var(--stop2)); }
.go.live .l1 { font-size: 2.6rem; font-variant-numeric: tabular-nums; }
.go:active { transform: translateX(-50%) scale(0.97); }

/* sheets */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--sheet); border-radius: 22px 22px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  max-height: 88vh; overflow-y: auto; -webkit-user-select: text; user-select: text;
}
.sheet .in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font-size: 1.2rem; }
.sheet p { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
.fields { display: flex; flex-wrap: wrap; gap: 10px; }
.fields label { display: flex; flex-direction: column; gap: 5px; font-size: 0.8rem; color: var(--muted); }
.fields .grow { flex: 1 1 220px; min-width: 0; }
input, textarea { font: 500 16px var(--font); color: var(--fg); background: #0F0E0E; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
textarea { min-height: 96px; font: 13px ui-monospace, Menlo, monospace; }
input.small { width: 82px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px; padding: 12px 18px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
.btn.pri { background: var(--go2); border-color: var(--go2); color: #06231B; }
.btn.del { color: var(--danger); border-color: var(--danger); }
.btn.del.armed { background: var(--danger); color: #2A0907; }
.err { color: var(--danger); font-size: 0.9rem; min-height: 1em; }
.ok { color: var(--go1); font-size: 0.9rem; }
@media (prefers-reduced-motion: reduce) { .row.live .dot { animation: none; } .go:active { transform: translateX(-50%); } }
</style>
</head>
<body>
<div class="top">
  <div class="nav">
    <button class="icon" id="addBtn" type="button" aria-label="Wee achteraf invullen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <h1>WEEËN</h1>
    <button class="icon" id="setBtn" type="button" aria-label="Gegevens overzetten">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="stats">
    <div><div class="v" id="sDur">–</div><div class="k">gemid. duur</div></div>
    <div><div class="v" id="sCount">0</div><div class="k">weeën<br>laatste uur</div></div>
    <div><div class="v" id="sInt">–</div><div class="k">gemid. frequentie</div></div>
  </div>
</div>

<main class="timeline">
  <div class="heads" id="heads"><span>Duur</span><span></span><span>Frequentie</span></div>
  <div class="rows" id="rows"></div>
</main>

<div class="fade"></div>
<button class="go" id="goBtn" type="button"><span class="l1" id="goL1">WEE</span><span class="l2" id="goL2">BEGONNEN</span></button>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>

<script>
(function () {
  const LS_KEY = "weeen-suzy-v1";
  let items = [];
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const MONTHS = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];

  function fmtDur(ms) {
    if (ms == null || !isFinite(ms) || ms < 0) return "–";
    const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h ? h + ":" + pad(m) + ":" + pad(sec) : m + ":" + pad(sec);
  }
  const hhmm = (ms) => { const d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const dayLabel = (ms) => { const d = new Date(ms); return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); };
  const dayKey = (ms) => new Date(ms).toDateString();
  function toInput(ms) { const d = new Date(ms); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }
  const fromInput = (v) => (v ? new Date(v).getTime() : NaN);
  const sorted = () => items.slice().sort((a, b) => a.start - b.start);
  const running = () => sorted().filter((i) => i.end == null).pop() || null;
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const NR_KEY = "weeen-suzy-first-nr";
  function firstNr() { try { const n = parseInt(localStorage.getItem(NR_KEY) || "1", 10); return n > 0 ? n : 1; } catch (e) { return 1; } }
  function load() { try { const v = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch (e) {} }
  function put(item) {
    const clean = { id: item.id, start: item.start, end: item.end == null ? null : item.end };
    const idx = items.findIndex((i) => i.id === item.id);
    if (idx >= 0) items[idx] = clean; else items.push(clean);
    save(); render();
  }
  function remove(id) { items = items.filter((i) => i.id !== id); save(); render(); }

  // big button
  $("goBtn").addEventListener("click", () => {
    const r = running();
    if (r) put({ ...r, end: Date.now() }); else put({ id: newId(), start: Date.now(), end: null });
    try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
  });

  function renderButton() {
    const r = running();
    const btn = $("goBtn");
    if (r) {
      btn.classList.add("live");
      $("goL1").textContent = fmtDur(Date.now() - r.start);
      $("goL2").textContent = "WEE VOORBIJ";
      const live = document.querySelector(".row.live .dur .a");
      if (live) live.textContent = fmtDur(Date.now() - r.start);
    } else {
      btn.classList.remove("live");
      $("goL1").textContent = "WEE";
      $("goL2").textContent = "BEGONNEN";
    }
  }
  function renderStats() {
    const now = Date.now(), s = sorted(), hour = s.filter((i) => i.start >= now - 3600000);
    $("sCount").textContent = String(hour.length);
    const done = hour.filter((i) => i.end != null);
    $("sDur").textContent = done.length ? fmtDur(done.reduce((a, i) => a + (i.end - i.start), 0) / done.length) : "–";
    const gaps = [];
    for (let k = 1; k < s.length; k++) if (s[k].start >= now - 3600000) gaps.push(s[k].start - s[k - 1].start);
    $("sInt").textContent = gaps.length ? fmtDur(gaps.reduce((a, b) => a + b, 0) / gaps.length) : "–";
  }
  function renderRows() {
    const s = sorted(), box = $("rows");
    $("heads").hidden = !s.length;
    box.classList.toggle("has", s.length > 1);
    if (!s.length) { box.innerHTML = '<div class="empty">Nog geen weeën. Tik op de groene knop als er een begint, of op + om er een achteraf in te vullen.</div>'; return; }
    const html = [];
    for (let k = s.length - 1; k >= 0; k--) {
      const i = s[k], prev = s[k - 1];
      const live = i.end == null;
      html.push(
        '<div class="row' + (live ? " live" : "") + '">' +
          '<div class="dur" data-id="' + i.id + '"><div class="a">' + (live ? fmtDur(Date.now() - i.start) : fmtDur(i.end - i.start)) + '</div><div class="b">' + hhmm(i.start) + '</div></div>' +
          '<button class="dot" type="button" data-id="' + i.id + '" aria-label="Wee ' + (k + firstNr()) + ' aanpassen">' + (k + firstNr()) + '</button>' +
          '<div class="freq">' + (prev ? fmtDur(i.start - prev.start) : "") + '</div>' +
        '</div>'
      );
      if (prev && dayKey(prev.start) !== dayKey(i.start)) html.push('<div class="sep"><span>' + dayLabel(prev.start) + '</span></div>');
    }
    box.innerHTML = html.join("");
    box.querySelectorAll("[data-id]").forEach((el) => el.addEventListener("click", () => openEdit(el.dataset.id)));
  }
  function render() { renderRows(); renderStats(); renderButton(); }

  // sheets
  function openSheet(html) { $("sheetIn").innerHTML = html; $("sheet").hidden = false; $("backdrop").hidden = false; }
  function closeSheet() { $("sheet").hidden = true; $("backdrop").hidden = true; $("sheetIn").innerHTML = ""; }
  $("backdrop").addEventListener("click", closeSheet);

  function editorFields(item) {
    const dur = item.end != null ? Math.round((item.end - item.start) / 1000) : null;
    return '<div class="fields">' +
      '<label class="grow">Begin<input type="datetime-local" step="1" id="fStart" value="' + toInput(item.start) + '"></label>' +
      '<label>Duur min<input class="small" type="number" inputmode="numeric" min="0" id="fMin" value="' + (dur != null ? Math.floor(dur / 60) : "") + '"></label>' +
      '<label>sec<input class="small" type="number" inputmode="numeric" min="0" max="59" id="fSec" value="' + (dur != null ? dur % 60 : "") + '"></label>' +
      '</div><div class="err" id="fErr"></div>';
  }
  function readFields(allowOpen) {
    const start = fromInput($("fStart").value), mv = $("fMin").value.trim(), sv = $("fSec").value.trim();
    if (!isFinite(start)) return { err: "Vul een begintijd in." };
    if (mv === "" && sv === "") return allowOpen ? { start, end: null } : { err: "Vul de duur in." };
    const secs = parseInt(mv || "0", 10) * 60 + parseInt(sv || "0", 10);
    if (!(secs > 0)) return { err: "De duur moet meer dan 0 seconden zijn." };
    return { start, end: start + secs * 1000 };
  }
  function openEdit(id) {
    const s = sorted(), idx = s.findIndex((i) => i.id === id), item = s[idx];
    if (!item) return;
    openSheet('<h2>Wee ' + (idx + firstNr()) + ' aanpassen</h2>' + editorFields(item) +
      (item.end == null ? '<p>Deze wee loopt nog. Laat de duur leeg om hem door te laten lopen.</p>' : '') +
      '<div class="btns"><button class="btn pri" id="fSave" type="button">Opslaan</button><button class="btn" id="fCancel" type="button">Annuleren</button><button class="btn del" id="fDel" type="button">Verwijderen</button></div>');
    $("fSave").onclick = () => { const r = readFields(item.end == null); if (r.err) { $("fErr").textContent = r.err; return; } put({ id: item.id, start: r.start, end: r.end }); closeSheet(); };
    $("fCancel").onclick = closeSheet;
    $("fDel").onclick = () => { const b = $("fDel"); if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Zeker? Tik nogmaals"; return; } remove(item.id); closeSheet(); };
  }
  $("addBtn").addEventListener("click", () => {
    const t = Date.now() - 5 * 60000;
    openSheet('<h2>Wee achteraf invullen</h2>' + editorFields({ start: t, end: t + 60000 }) +
      '<div class="btns"><button class="btn pri" id="fSave" type="button">Toevoegen</button><button class="btn" id="fCancel" type="button">Annuleren</button></div>');
    $("fSave").onclick = () => { const r = readFields(false); if (r.err) { $("fErr").textContent = r.err; return; } put({ id: newId(), start: r.start, end: r.end }); closeSheet(); };
    $("fCancel").onclick = closeSheet;
  });

  $("setBtn").addEventListener("click", () => {
    openSheet('<h2>Gegevens overzetten</h2>' +
      '<p>Alles staat alleen op deze telefoon. Kopieer de lijst als back-up, of plak een lijst om weeën toe te voegen. Dubbele worden overgeslagen.</p>' +
      '<div class="btns"><button class="btn" id="cpBtn" type="button">Lijst kopiëren</button></div>' +
      '<textarea id="imp" placeholder="Plak hier een lijst"></textarea>' +
      '<div class="btns"><button class="btn pri" id="impBtn" type="button">Toevoegen uit lijst</button><button class="btn" id="fCancel" type="button">Sluiten</button></div>' +
      '<div id="msg"></div>' +
      '<div class="fields"><label>Nummer van de eerste wee in de lijst<input class="small" type="number" inputmode="numeric" min="1" id="nrIn" value="' + firstNr() + '"></label></div>');
    const msg = (t, ok) => { $("msg").className = ok ? "ok" : "err"; $("msg").textContent = t; };
    $("nrIn").oninput = () => { const n = parseInt($("nrIn").value, 10); if (n > 0) { try { localStorage.setItem(NR_KEY, String(n)); } catch (e) {} render(); } };
    $("fCancel").onclick = closeSheet;
    $("cpBtn").onclick = () => {
      const text = JSON.stringify(sorted());
      $("imp").value = text;
      const fb = () => { $("imp").select(); msg("Kopiëren lukte niet vanzelf. De lijst staat geselecteerd in het vak.", false); };
      try { navigator.clipboard.writeText(text).then(() => msg("Gekopieerd.", true), fb); } catch (e) { fb(); }
    };
    $("impBtn").onclick = () => {
      let data;
      try { data = JSON.parse($("imp").value.trim()); } catch (e) { msg("Dit is geen geldige lijst. Plak de tekst precies zoals je hem kreeg.", false); return; }
      if (!Array.isArray(data)) { msg("Dit is geen geldige lijst.", false); return; }
      let added = 0;
      const m = !items.length && data[0] && /^r(\d+)$/.exec(String(data[0].id || ""));
      if (m) { try { localStorage.setItem(NR_KEY, m[1]); } catch (e) {} }
      for (const d of data) {
        const start = Number(d && d.start), end = d && d.end != null ? Number(d.end) : null;
        if (!isFinite(start) || (end != null && !(end > start))) continue;
        const id = d.id ? String(d.id) : newId();
        if (items.some((i) => i.id === id || Math.abs(i.start - start) < 20000)) continue;
        items.push({ id, start, end }); added++;
      }
      save(); render(); $("imp").value = "";
      msg(added ? added + (added === 1 ? " wee toegevoegd." : " weeën toegevoegd.") : "Niets nieuws gevonden; alles stond er al.", true);
    };
  });

  setInterval(renderButton, 250);
  setInterval(renderStats, 15000);
  async function wake() { try { if (navigator.wakeLock && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { items = load(); render(); wake(); } });
  wake();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

  items = load();
  render();
})();
</script>
</body>
</html>
